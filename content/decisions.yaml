# Decision log, numbered ADR style (ids sort the page). Each field restates content/resume.md (or a story that does); no invented options or numbers.
# Only standalone decisions live here; a decision that shaped a design doc is recorded inside that doc (status + revisit).
# status: one of PoC, In progress, In place, from the resume. revisit: forward reasoning, not history.
- id: adr-01
  title: 'Regenerate from the source, not hand-patch'
  context: 'Records sometimes failed to land in Oracle, and recovery was manual and Perl-based. Once, a single corrupt message made a splitter reject tens of thousands of messages.'
  decision: 'Rebuilt self-healing repair as idempotent shell automation: it detects the records that failed to land, captures their keys and resends them to the mainframe, which regenerates them.'
  consequence: 'The manual, Perl-based recovery was replaced, and the rejected data was regenerated from the source of truth instead of being hand-edited.'
  status: 'In place'
  revisit: 'Revisit if the source can no longer regenerate a record on request: repair would then need another source of truth.'
  related: ['/stories/one-bad-message/']
- id: adr-02
  title: 'Secrets first in the cron-to-Airflow move'
  context: 'A ~75-job cron estate (shell reporting and Oracle table-maintenance jobs) is moving to Apache Airflow.'
  decision: 'Phase one is a secrets-first Git migration.'
  consequence: 'A working proof of concept covers a small set of jobs; the full migration is not complete.'
  status: 'In progress'
  revisit: 'Revisit if a job turns up that cannot move without a secret phase one did not cover.'
- id: adr-03
  title: 'An on-premises LLM, no cloud dependency'
  context: 'Platform health is tracked in live observability metrics (Datadog and custom DogStatsD health metrics).'
  decision: 'Ollama with a 3.8B open-source model turns live observability metrics into plain-English platform health summaries, with no cloud dependency.'
  consequence: 'Accompanied by a 16-item AI opportunity roadmap.'
  status: 'PoC'
  revisit: 'Revisit if sending platform metrics to a cloud model becomes acceptable, or if a 3.8B model stops being enough for the summaries.'
- id: adr-04
  title: 'Non-production before production for MQ upgrades'
  context: 'In the IBM MQ upgrade lifecycle for a multi-environment platform, a client-compatibility defect led to a controlled rollback and cold restore.'
  decision: 'Established a non-production-to-production upgrade sequence.'
  status: 'In place'
  revisit: 'Revisit if non-production stops matching production closely enough to surface client-compatibility defects first.'
- id: adr-05
  title: 'Idempotent, guarded backfills'
  context: 'Order-line records were missing across 23 company codes, and a purge of parent rows needed sizing.'
  decision: 'Built backfill and purge tooling with idempotent inserts, cascade guards and zero-difference reconciliation.'
  consequence: 'The recovery and the purge sizing are in the story.'
  status: 'In place'
  revisit: 'Revisit if a repair cannot be written as an idempotent insert: it then needs its own guard before it runs.'
  related: ['/stories/backfill-16900/']
